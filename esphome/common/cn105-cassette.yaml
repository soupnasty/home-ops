# Shared package for all six MLZ-KP12NA cassettes.
# Per-node files set substitutions only — see hvac-living.yaml for the shape.

substitutions:
  # Overridden per node:
  name: hvac-node
  friendly_name: HVAC Node
  # Grove port on the Atom S3 Lite is G1/G2. Which is TX vs RX depends on the
  # Serin cable's wiring — verify against its pinout on the desk-flash bench
  # and swap here if the unit never responds.
  tx_pin: GPIO1
  rx_pin: GPIO2

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: m5stack-atoms3
  framework:
    type: esp-idf

logger:
  baud_rate: 0 # UART is dedicated to the CN105 link

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${name} fallback
    password: !secret fallback_ap_password

captive_portal:

uart:
  id: cn105_uart
  tx_pin: ${tx_pin}
  rx_pin: ${rx_pin}
  baud_rate: 2400 # some units want 9600 — try that if state never populates
  data_bits: 8
  parity: EVEN
  stop_bits: 1

climate:
  - platform: mitsubishi_cn105
    id: hvac
    name: None # single main entity; takes the device's friendly_name
    uart_id: cn105_uart
    update_interval: 1s
    current_temperature_min_interval: 60s
    supported_swing_modes: VERTICAL # MLZ cassettes: vertical vane only
    visual:
      min_temperature: 16
      max_temperature: 31
      # 0.5°C target steps map to clean 1°F increments in HA/HomeKit.
      # (The core component has no fahrenheit option; HA converts units.)
      temperature_step:
        target_temperature: 0.5
        current_temperature: 0.1
