# Emporia Vue 3 whole-home energy monitor (ESPHome-flashed, fully local).
# First flash is serial with energy-monitor-minimal.yaml; this full config is
# pushed OTA afterwards. See docs/energy-monitoring.md for the install spec.
#
# CT map is from the panel directory (docs/energy-monitoring.md). Two things are
# tuned on/after install day with real current flowing:
#   - sign flips: a CT clamped "backwards" reads negative — fix with multiply: -1
#     in that circuit's filters (or re-clamp), don't re-open the panel for it.
#   - phase calibration: verify mains voltage with a multimeter at an outlet;
#     new_cal = 0.01925 * actual_v / reported_v.
substitutions:
  name: energy-monitor
  friendly_name: Energy Monitor

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  flash_size: 8MB
  cpu_frequency: 160MHz # Vue browns out at ESPHome's 240MHz default
  framework:
    type: esp-idf

preferences:
  flash_write_interval: 48h # protect flash; total_daily_energy restores are not critical

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${name} Fallback
    password: !secret fallback_ap_password

captive_portal:

external_components:
  # Pinned 2026-08-11 (dev HEAD; includes the vue3 variant + the 2026.4.x
  # watchdog/polling fix). Bump deliberately, never track a moving branch.
  - source: github://emporia-vue-local/esphome@79e2747371b70370b96ef919f7c1e556f461344a
    components: [emporia_vue]

time:
  - platform: homeassistant
    id: ha_time # total_daily_energy needs a time source for midnight reset

i2c: # Vue 3 pins (Gen 2 was 21/22); 400kHz + 1ms timeout per component docs
  sda: 5
  scl: 18
  scan: false
  frequency: 400kHz
  timeout: 1ms
  id: i2c_vue

sensor:
  - platform: emporia_vue
    variant: vue3
    i2c_id: i2c_vue
    phases:
      # Install-day finding (2026-08-19): the harness wires landed on the OPPOSITE
      # legs from the plan — black is NOT on the same leg as the left service
      # conductor the A-clamp is on. Fixed in hardware by swapping the two main CT
      # plugs at the Vue (A-port clamp and B-port clamp trade conductors), which
      # made both mains read positive. So: phase_a = the leg the BLACK harness
      # breaker sits on; which physical rows of the panel that corresponds to is
      # UNVERIFIED. When adding a branch CT, guess its phase_id, and if it reads
      # negative under load, flip the phase_id (magnitude is unaffected).
      - id: phase_a
        input: BLACK
        calibration: 0.01925
        voltage:
          name: Phase A Voltage
          filters: [throttle_average: 5s]
      - id: phase_b
        input: RED
        calibration: 0.01925
        voltage:
          name: Phase B Voltage
          filters: [throttle_average: 5s]
    ct_clamps:
      # --- mains (CT plugs deliberately swapped at the device — see note above) ---
      - { phase_id: phase_a, input: "A", power: { id: power_main_a, name: Main A Power, filters: [throttle_average: 5s] } }
      - { phase_id: phase_b, input: "B", power: { id: power_main_b, name: Main B Power, filters: [throttle_average: 5s] } }
      # --- branch CTs (input = port number on the Vue; as-built 2026-08-19) ---
      # phase_id guesses use QO row parity (legs alternate per ROW; row = ceil(pos/2)):
      # odd rows -> phase_a, even rows -> phase_b. Which leg is actually phase_a is
      # unverified — if a channel reads negative under load, flip its phase_id
      # (magnitude is unaffected); if roughly half read negative, the parity guess
      # is inverted — flip them all. 240V 2-pole circuits have one CT on one hot
      # with multiply: 2; their phase_id = whichever leg the clamped conductor is on.
      #
      # HVAC model corrected 2026-08-19 with live data: 1/3 = OUTDOOR UNIT (compressor;
      # read ~2.6kW while cooling), 5/7 = indoor heads on their own 240V circuit
      # (~50W; killing 5/7 blacks out every panel instantly, killing 1/3 leaves heads
      # powered until they self-shutdown staggered 25-45 min later on lost comms).
      # The earlier condensate-pump theory for 1/3 is dead.
      - { phase_id: phase_a, input: "1", power: { id: power_hvac, name: HVAC Outdoor Power, filters: [multiply: 2, throttle_average: 5s] } }
      - { phase_id: phase_b, input: "2", power: { id: power_hvac_indoor, name: HVAC Indoor Units Power, filters: [multiply: 2, throttle_average: 5s] } }
      # Dryer (2/4): 120/240V, single CT x2 (accepts ~100-200W error from the 120V motor leg).
      # Dead-band: true idle is exactly 0W, so clamp the ±0.5W CT noise (else the
      # daily counter drifts slightly negative overnight).
      - { phase_id: phase_a, input: "3", power: { id: power_dryer, name: Dryer Power, filters: [multiply: 2, throttle_average: 5s, 'lambda': 'return fabsf(x) < 2.0f ? 0.0f : x;'] } }
      - { phase_id: phase_b, input: "4", power: { id: power_living, name: Living Room Power, filters: [throttle_average: 5s] } } # breaker 6
      - { phase_id: phase_b, input: "5", power: { id: power_kitchen_lights, name: Kitchen Lights Power, filters: [throttle_average: 5s] } } # breaker 8
      # Garage outlets (9) + lights (13) share one CT: same leg (rows 5 & 7), so both
      # wires pass through the clamp in the SAME direction, x1.
      - { phase_id: phase_a, input: "6", power: { id: power_garage, name: Garage Power, filters: [throttle_average: 5s] } }
      - { phase_id: phase_a, input: "7", power: { id: power_laundry, name: Laundry Outlets Power, filters: [throttle_average: 5s] } } # breaker 11
      - { phase_id: phase_a, input: "8", power: { id: power_master, name: Master Power, filters: [throttle_average: 5s] } } # breaker 12
      # Family room is an MWBC on handle-tied 17/19 (opposite legs) -> CT per leg, summed below
      - { phase_id: phase_b, input: "9", power: { id: power_family_a, name: Family Room L1 Power, internal: true, filters: [throttle_average: 5s] } } # breaker 17
      - { phase_id: phase_a, input: "10", power: { id: power_bed1, name: Bedroom 1 Power, filters: [throttle_average: 5s] } } # breaker 15
      - { phase_id: phase_a, input: "11", power: { id: power_family_b, name: Family Room L2 Power, internal: true, filters: [throttle_average: 5s] } } # breaker 19
      - { phase_id: phase_b, input: "12", power: { id: power_nursery, name: Nursery Power, filters: [throttle_average: 5s] } } # breaker 21
      # Water heater (24/26): pure 240V. Sign verified 2026-08-19 under load
      # (+5880W while heating — 5500W element at ~245V) after Andrew re-clamped
      # the CT onto the other conductor. Dead-band like the dryer: resistive
      # element idles at exactly 0W.
      - { phase_id: phase_b, input: "13", power: { id: power_water_heater, name: Water Heater Power, filters: [multiply: 2, throttle_average: 5s, 'lambda': 'return fabsf(x) < 2.0f ? 0.0f : x;'] } }
      - { phase_id: phase_b, input: "14", power: { id: power_dishwasher, name: Dishwasher Power, filters: [throttle_average: 5s] } } # breaker 25
      - { phase_id: phase_a, input: "15", power: { id: power_fridge, name: Refrigerator Power, filters: [throttle_average: 5s] } } # breaker 28
      - { phase_id: phase_a, input: "16", power: { id: power_kitchen_outlets, name: Kitchen Outlets Power, filters: [throttle_average: 5s] } } # breaker 35

  # --- derived totals ---
  - platform: template
    id: power_total
    name: Total Power
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    update_interval: 5s
    lambda: return id(power_main_a).state + id(power_main_b).state;
  - platform: template
    id: power_family
    name: Family Room Power
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    update_interval: 5s
    lambda: return id(power_family_a).state + id(power_family_b).state;
  # Unmetered remainder: whole home minus all 16 branch channels. Shows what
  # the uncovered breakers (disposal, etc.) draw; should stay small and never
  # strongly negative (strongly negative = a branch channel double-counting).
  - platform: template
    id: power_other
    name: Other Power
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    update_interval: 5s
    lambda: |-
      return id(power_total).state
        - id(power_hvac).state - id(power_hvac_indoor).state
        - id(power_dryer).state - id(power_water_heater).state
        - id(power_living).state - id(power_family).state
        - id(power_master).state - id(power_bed1).state
        - id(power_nursery).state - id(power_fridge).state
        - id(power_dishwasher).state - id(power_kitchen_outlets).state
        - id(power_kitchen_lights).state - id(power_laundry).state
        - id(power_garage).state;
  # --- energy (kWh) for the HA Energy dashboard ---
  - { platform: total_daily_energy, name: Total Daily Energy, power_id: power_total, restore: false, filters: [throttle: 60s] }
  - { platform: total_daily_energy, name: Other Daily Energy, power_id: power_other, restore: false, filters: [throttle: 60s] }
  - { platform: total_daily_energy, name: HVAC Outdoor Daily Energy, power_id: power_hvac, restore: false, filters: [throttle: 60s] }
  - { platform: total_daily_energy, name: HVAC Indoor Units Daily Energy, power_id: power_hvac_indoor, restore: false, filters: [throttle: 60s] }
  - { platform: total_daily_energy, name: Dryer Daily Energy, power_id: power_dryer, restore: false, filters: [throttle: 60s] }
  - { platform: total_daily_energy, name: Living Room Daily Energy, power_id: power_living, restore: false, filters: [throttle: 60s] }
  - { platform: total_daily_energy, name: Kitchen Lights Daily Energy, power_id: power_kitchen_lights, restore: false, filters: [throttle: 60s] }
  - { platform: total_daily_energy, name: Garage Daily Energy, power_id: power_garage, restore: false, filters: [throttle: 60s] }
  - { platform: total_daily_energy, name: Laundry Outlets Daily Energy, power_id: power_laundry, restore: false, filters: [throttle: 60s] }
  - { platform: total_daily_energy, name: Master Daily Energy, power_id: power_master, restore: false, filters: [throttle: 60s] }
  - { platform: total_daily_energy, name: Family Room Daily Energy, power_id: power_family, restore: false, filters: [throttle: 60s] }
  - { platform: total_daily_energy, name: Bedroom 1 Daily Energy, power_id: power_bed1, restore: false, filters: [throttle: 60s] }
  - { platform: total_daily_energy, name: Nursery Daily Energy, power_id: power_nursery, restore: false, filters: [throttle: 60s] }
  - { platform: total_daily_energy, name: Water Heater Daily Energy, power_id: power_water_heater, restore: false, filters: [throttle: 60s] }
  - { platform: total_daily_energy, name: Dishwasher Daily Energy, power_id: power_dishwasher, restore: false, filters: [throttle: 60s] }
  - { platform: total_daily_energy, name: Refrigerator Daily Energy, power_id: power_fridge, restore: false, filters: [throttle: 60s] }
  - { platform: total_daily_energy, name: Kitchen Outlets Daily Energy, power_id: power_kitchen_outlets, restore: false, filters: [throttle: 60s] }
