default_config:

homeassistant:
  unit_system: us_customary # display °F everywhere; devices still speak °C natively

# Theme files live in themes/ — after editing, "frontend.reload_themes" applies
# them without a restart. Pick per-device via profile, or set a default with
# the frontend.set_theme action.
frontend:
  themes: !include_dir_merge_named themes

lovelace:
  dashboards:
    hvac-control:
      mode: yaml
      title: HVAC
      icon: mdi:hvac
      filename: dashboards/hvac.yaml
    home-cameras:
      mode: yaml
      title: Cameras
      icon: mdi:cctv
      filename: dashboards/cameras.yaml

# HomeKit is a projection: curated subset only, climate first.
# First entry = the original bridge (do not rename/re-port — paired in Apple Home).
# Cameras must each be their own accessory-mode instance (Apple requirement);
# one fixed port per camera, paired once via QR from HA notifications.
# video_codec copy = no transcoding (streams are H.264 already).
homekit:
  - filter:
      include_domains:
        - climate
      include_entities:
        - input_boolean.pairing_test
  - name: HomeKit Front Door
    port: 21064
    mode: accessory
    filter:
      include_entities: [camera.front_door]
    entity_config:
      camera.front_door:
        video_codec: copy
        linked_doorbell_sensor: binary_sensor.front_door_ding
        linked_motion_sensor: binary_sensor.front_door_motion
  - name: HomeKit Dining Room Cam
    port: 21065
    mode: accessory
    filter:
      include_entities: [camera.dining_room]
    entity_config:
      camera.dining_room:
        video_codec: copy
        linked_motion_sensor: binary_sensor.dining_room_motion
  - name: HomeKit Garage Cam
    port: 21066
    mode: accessory
    filter:
      include_entities: [camera.garage]
    entity_config:
      camera.garage:
        video_codec: copy
        linked_motion_sensor: binary_sensor.garage_motion
  - name: HomeKit Driveway Cam
    port: 21067
    mode: accessory
    filter:
      include_entities: [camera.driveway]
    entity_config:
      camera.driveway:
        video_codec: copy
        linked_motion_sensor: binary_sensor.driveway_motion
  - name: HomeKit Back Porch Cam
    port: 21068
    mode: accessory
    filter:
      include_entities: [camera.back_porch]
    entity_config:
      camera.back_porch:
        video_codec: copy
        linked_motion_sensor: binary_sensor.back_porch_motion
  - name: HomeKit Back Side Cam
    port: 21069
    mode: accessory
    filter:
      include_entities: [camera.back_side]
    entity_config:
      camera.back_side:
        video_codec: copy
        linked_motion_sensor: binary_sensor.back_side_motion
  - name: HomeKit Front Side Cam
    port: 21070
    mode: accessory
    filter:
      include_entities: [camera.front_side]
    entity_config:
      camera.front_side:
        video_codec: copy
        linked_motion_sensor: binary_sensor.front_side_motion

# TODO: remove after Phase 1 — dummy accessory so the HomeKit bridge has
# something to expose for the mDNS/pairing test before the HVAC nodes exist.
input_boolean:
  pairing_test:
    name: Pairing Test
  upstairs_setback_enabled:
    name: Upstairs Daytime Setback
    icon: mdi:home-thermometer

# Knobs for automations/upstairs-setback.yaml — adjustable from the HA app;
# values persist across restarts (no initial: on purpose). Set them once in
# the app after deploy.
input_number:
  upstairs_setback_temp:
    name: Upstairs Setback Target
    min: 74
    max: 82
    step: 0.5
    unit_of_measurement: °F
    icon: mdi:thermometer-chevron-up
  upstairs_comfort_temp:
    name: Upstairs Comfort Target
    min: 68
    max: 76
    step: 0.5
    unit_of_measurement: °F
    icon: mdi:thermometer-check
  nursery_temp_ceiling:
    name: Nursery Temp Ceiling
    min: 74
    max: 80
    step: 0.5
    unit_of_measurement: °F
    icon: mdi:thermometer-alert

input_datetime:
  upstairs_setback_start:
    name: Upstairs Setback Start
    has_time: true
    has_date: false
  upstairs_restore_time:
    name: Upstairs Restore Time
    has_time: true
    has_date: false

automation: !include_dir_merge_list automations/

# Room temperatures for rooms without a standalone sensor, derived from the
# HVAC units' intake sensors — used as each area's temperature entity so the
# overview area tiles show a reading. Living room + nursery use their Zigbee
# sensors directly instead.
template:
  - sensor:
      - name: "Kitchen Temperature"
        unique_id: kitchen_temperature_from_hvac
        device_class: temperature
        state_class: measurement
        unit_of_measurement: °F
        state: "{{ state_attr('climate.kitchen_hvac', 'current_temperature') }}"
        availability: "{{ state_attr('climate.kitchen_hvac', 'current_temperature') is not none }}"
      - name: "Master Bedroom Temperature"
        unique_id: master_bedroom_temperature_from_hvac
        device_class: temperature
        state_class: measurement
        unit_of_measurement: °F
        state: "{{ state_attr('climate.master_bedroom_hvac', 'current_temperature') }}"
        availability: "{{ state_attr('climate.master_bedroom_hvac', 'current_temperature') is not none }}"
      - name: "Bedroom 1 Temperature"
        unique_id: bedroom_1_temperature_from_hvac
        device_class: temperature
        state_class: measurement
        unit_of_measurement: °F
        state: "{{ state_attr('climate.bedroom_1_hvac', 'current_temperature') }}"
        availability: "{{ state_attr('climate.bedroom_1_hvac', 'current_temperature') is not none }}"
