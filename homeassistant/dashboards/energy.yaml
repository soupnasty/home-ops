# Energy dashboard (yaml mode — edits apply on browser refresh, no restart).
# Data: Emporia Vue 3 (esphome/energy-monitor.yaml), 16 branch CTs + mains.
# Custom cards: apexcharts-card + auto-entities (www/, registered in
# .storage/lovelace_resources).
# Layout: full-width Summary, then Circuits | Today side by side (both list all
# 16 loads incl. the computed "Other" remainder), full-width history charts.
# Charts use the same validated dark-mode categorical palette as hvac.yaml
# (fixed hue order, color follows the entity). Big loads and room circuits get
# separate charts so kW-scale traces don't squash the sub-300W ones (one axis
# per chart, never dual-axis).
# The built-in HA Energy view (/energy) is wired separately via .storage/energy.
title: Power
views:
  - title: Power
    path: power
    type: sections
    max_columns: 2
    sections:
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Summary
          - type: tile
            entity: sensor.energy_monitor_total_power
            name: Whole home
            icon: mdi:home-lightning-bolt
            color: primary
          - type: tile
            entity: sensor.energy_monitor_other_power
            name: Other (unmetered)
            icon: mdi:flash-outline
          - type: tile
            entity: sensor.energy_monitor_main_a_power
            name: Main A
            icon: mdi:transmission-tower
          - type: tile
            entity: sensor.energy_monitor_main_b_power
            name: Main B
            icon: mdi:transmission-tower
          - type: tile
            entity: sensor.energy_monitor_total_daily_energy
            name: Today so far
            icon: mdi:counter
            color: primary
          - type: tile
            entity: sensor.energy_cost_today
            name: Cost today
            icon: mdi:currency-usd
            color: primary
          - type: tile
            entity: sensor.energy_monitor_phase_a_voltage
            name: Phase A
            icon: mdi:sine-wave
          - type: tile
            entity: sensor.energy_monitor_phase_b_voltage
            name: Phase B
            icon: mdi:sine-wave
          - type: tile
            entity: input_number.electricity_price
            name: Rate
            icon: mdi:cash-edit
            features:
              - type: numeric-input
                style: buttons

      - type: grid
        cards:
          - type: heading
            heading: Circuits
          - type: tile
            entity: sensor.energy_monitor_hvac_outdoor_power
            name: HVAC outdoor
            icon: mdi:heat-pump
          - type: tile
            entity: sensor.energy_monitor_water_heater_power
            name: Water heater
            icon: mdi:water-boiler
          - type: tile
            entity: sensor.energy_monitor_dryer_power
            name: Dryer
            icon: mdi:tumble-dryer
          - type: tile
            entity: sensor.energy_monitor_hvac_indoor_units_power
            name: HVAC indoor
            icon: mdi:air-conditioner
          - type: tile
            entity: sensor.energy_monitor_living_room_power
            name: Living room
            icon: mdi:sofa
          - type: tile
            entity: sensor.energy_monitor_family_room_power
            name: Family room
            icon: mdi:television
          - type: tile
            entity: sensor.energy_monitor_refrigerator_power
            name: Refrigerator
            icon: mdi:fridge
          - type: tile
            entity: sensor.energy_monitor_master_power
            name: Master
            icon: mdi:bed-king
          - type: tile
            entity: sensor.energy_monitor_bedroom_1_power
            name: Bedroom 1
            icon: mdi:bed
          - type: tile
            entity: sensor.energy_monitor_nursery_power
            name: Nursery
            icon: mdi:teddy-bear
          - type: tile
            entity: sensor.energy_monitor_kitchen_outlets_power
            name: Kitchen outlets
            icon: mdi:power-plug
          - type: tile
            entity: sensor.energy_monitor_kitchen_lights_power
            name: Kitchen lights
            icon: mdi:ceiling-light
          - type: tile
            entity: sensor.energy_monitor_dishwasher_power
            name: Dishwasher
            icon: mdi:dishwasher
          - type: tile
            entity: sensor.energy_monitor_laundry_outlets_power
            name: Laundry outlets
            icon: mdi:washing-machine
          - type: tile
            entity: sensor.energy_monitor_garage_power
            name: Garage
            icon: mdi:garage
          - type: tile
            entity: sensor.energy_monitor_other_power
            name: Other (unmetered)
            icon: mdi:flash-outline

      - type: grid
        cards:
          - type: heading
            heading: Today
          # auto-entities: live-sorted highest→lowest by state. Whole home is
          # the sum, so it always sorts to the top.
          - type: custom:auto-entities
            card:
              type: entities
            sort:
              method: state
              numeric: true
              reverse: true
            filter:
              include:
                - entity_id: sensor.energy_monitor_total_daily_energy
                  options: { name: Whole home, icon: mdi:home-lightning-bolt }
                - entity_id: sensor.energy_monitor_hvac_outdoor_daily_energy
                  options: { name: HVAC outdoor, icon: mdi:heat-pump }
                - entity_id: sensor.energy_monitor_water_heater_daily_energy
                  options: { name: Water heater, icon: mdi:water-boiler }
                - entity_id: sensor.energy_monitor_dryer_daily_energy
                  options: { name: Dryer, icon: mdi:tumble-dryer }
                - entity_id: sensor.energy_monitor_hvac_indoor_units_daily_energy
                  options: { name: HVAC indoor, icon: mdi:air-conditioner }
                - entity_id: sensor.energy_monitor_living_room_daily_energy
                  options: { name: Living room, icon: mdi:sofa }
                - entity_id: sensor.energy_monitor_family_room_daily_energy
                  options: { name: Family room, icon: mdi:television }
                - entity_id: sensor.energy_monitor_refrigerator_daily_energy
                  options: { name: Refrigerator, icon: mdi:fridge }
                - entity_id: sensor.energy_monitor_master_daily_energy
                  options: { name: Master, icon: mdi:bed-king }
                - entity_id: sensor.energy_monitor_bedroom_1_daily_energy
                  options: { name: Bedroom 1, icon: mdi:bed }
                - entity_id: sensor.energy_monitor_nursery_daily_energy
                  options: { name: Nursery, icon: mdi:teddy-bear }
                - entity_id: sensor.energy_monitor_kitchen_outlets_daily_energy
                  options: { name: Kitchen outlets, icon: mdi:power-plug }
                - entity_id: sensor.energy_monitor_kitchen_lights_daily_energy
                  options: { name: Kitchen lights, icon: mdi:ceiling-light }
                - entity_id: sensor.energy_monitor_laundry_outlets_daily_energy
                  options: { name: Laundry outlets, icon: mdi:washing-machine }
                - entity_id: sensor.energy_monitor_dishwasher_daily_energy
                  options: { name: Dishwasher, icon: mdi:dishwasher }
                - entity_id: sensor.energy_monitor_garage_daily_energy
                  options: { name: Garage, icon: mdi:garage }
                - entity_id: sensor.energy_monitor_other_daily_energy
                  options: { name: Other (unmetered), icon: mdi:flash-outline }

      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: History
          - type: custom:apexcharts-card
            grid_options:
              columns: full
            graph_span: 24h
            header:
              show: true
              title: Whole home — last 24h
              show_states: true
              colorize_states: true
            yaxis:
              - decimals: 0
                min: 0
                apex_config:
                  tickAmount: 4
                  forceNiceScale: true
            apex_config:
              chart:
                height: 260
              grid:
                borderColor: "rgba(255, 255, 255, 0.08)"
            all_series_config:
              stroke_width: 2
              group_by:
                func: avg
                duration: 5min
              show:
                extremas: false
                legend_value: false
            series:
              - entity: sensor.energy_monitor_total_power
                name: Total
                color: "#3987e5"
                type: area
                opacity: 0.15
          # Hourly kWh bars from long-term statistics — answers "when did the
          # energy go" (the power lines above answer "what shape is the load").
          # Statistics compile at the top of each hour, so the current hour
          # appears only after it closes.
          - type: custom:apexcharts-card
            grid_options:
              columns: full
            graph_span: 24h
            span:
              end: hour
            header:
              show: true
              title: Energy by hour — last 24h
              show_states: false
            yaxis:
              - decimals: 1
                min: 0
                apex_config:
                  tickAmount: 4
                  forceNiceScale: true
            apex_config:
              chart:
                height: 260
              grid:
                borderColor: "rgba(255, 255, 255, 0.08)"
            series:
              - entity: sensor.energy_monitor_total_daily_energy
                name: Energy
                color: "#3987e5"
                type: column
                unit: kWh
                float_precision: 2
                transform: return x / 1000;
                statistics:
                  type: change
                  period: hour
          - type: custom:apexcharts-card
            grid_options:
              columns: full
            graph_span: 24h
            header:
              show: true
              title: Big loads — last 24h
              show_states: true
              colorize_states: true
            yaxis:
              - decimals: 0
                min: 0
                apex_config:
                  tickAmount: 4
                  forceNiceScale: true
            apex_config:
              chart:
                height: 300
              grid:
                borderColor: "rgba(255, 255, 255, 0.08)"
              legend:
                show: true
            all_series_config:
              stroke_width: 2
              group_by:
                func: avg
                duration: 5min
              show:
                extremas: false
                legend_value: false
            series:
              - entity: sensor.energy_monitor_hvac_outdoor_power
                name: HVAC outdoor
                color: "#3987e5"
              - entity: sensor.energy_monitor_water_heater_power
                name: Water heater
                color: "#d95926"
              - entity: sensor.energy_monitor_dryer_power
                name: Dryer
                color: "#199e70"
              - entity: sensor.energy_monitor_hvac_indoor_units_power
                name: HVAC indoor units
                color: "#c98500"
          - type: custom:apexcharts-card
            grid_options:
              columns: full
            graph_span: 24h
            header:
              show: true
              title: Rooms & plugs — last 24h
              show_states: true
              colorize_states: true
            yaxis:
              - decimals: 0
                min: 0
                apex_config:
                  tickAmount: 4
                  forceNiceScale: true
            apex_config:
              chart:
                height: 300
              grid:
                borderColor: "rgba(255, 255, 255, 0.08)"
              legend:
                show: true
            all_series_config:
              stroke_width: 2
              group_by:
                func: avg
                duration: 5min
              show:
                extremas: false
                legend_value: false
            series:
              - entity: sensor.energy_monitor_living_room_power
                name: Living room
                color: "#3987e5"
              - entity: sensor.energy_monitor_family_room_power
                name: Family room
                color: "#d95926"
              - entity: sensor.energy_monitor_master_power
                name: Master
                color: "#199e70"
              - entity: sensor.energy_monitor_bedroom_1_power
                name: Bedroom 1
                color: "#c98500"
              - entity: sensor.energy_monitor_nursery_power
                name: Nursery
                color: "#d55181"
              - entity: sensor.energy_monitor_refrigerator_power
                name: Refrigerator
                color: "#9b7ce6"
