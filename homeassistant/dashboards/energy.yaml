# Energy dashboard (yaml mode — edits apply on browser refresh, no restart).
# Data: Emporia Vue 3 (esphome/energy-monitor.yaml), 16 branch CTs + mains.
# Charts use the same validated dark-mode categorical palette as hvac.yaml
# (fixed hue order, color follows the entity). Big loads and room circuits get
# separate charts so kW-scale traces don't squash the sub-300W ones (one axis
# per chart, never dual-axis).
# The built-in HA Energy view (/energy) is wired separately via .storage/energy.
title: Energy
views:
  - title: Power
    path: power
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Now
          - type: tile
            entity: sensor.energy_monitor_total_power
            name: Whole home
            icon: mdi:home-lightning-bolt
            color: primary
          - type: tile
            entity: sensor.energy_monitor_heat_pump_power
            name: Heat pump
            icon: mdi:heat-pump
          - type: tile
            entity: sensor.energy_monitor_water_heater_power
            name: Water heater
            icon: mdi:water-boiler
          - type: tile
            entity: sensor.energy_monitor_dryer_power
            name: Dryer
            icon: mdi:tumble-dryer
          - type: tile
            entity: sensor.energy_monitor_main_a_power
            name: Main A
            icon: mdi:transmission-tower
          - type: tile
            entity: sensor.energy_monitor_main_b_power
            name: Main B
            icon: mdi:transmission-tower
          - type: tile
            entity: sensor.energy_monitor_phase_a_voltage
            name: Phase A
            icon: mdi:sine-wave
          - type: tile
            entity: sensor.energy_monitor_phase_b_voltage
            name: Phase B
            icon: mdi:sine-wave
      - type: grid
        cards:
          - type: heading
            heading: Circuits
          - type: tile
            entity: sensor.energy_monitor_hvac_indoor_units_power
            name: HVAC indoor
          - type: tile
            entity: sensor.energy_monitor_living_room_power
            name: Living room
          - type: tile
            entity: sensor.energy_monitor_family_room_power
            name: Family room
          - type: tile
            entity: sensor.energy_monitor_master_power
            name: Master
          - type: tile
            entity: sensor.energy_monitor_bedroom_1_power
            name: Bedroom 1
          - type: tile
            entity: sensor.energy_monitor_nursery_power
            name: Nursery
          - type: tile
            entity: sensor.energy_monitor_refrigerator_power
            name: Refrigerator
          - type: tile
            entity: sensor.energy_monitor_dishwasher_power
            name: Dishwasher
          - type: tile
            entity: sensor.energy_monitor_kitchen_outlets_power
            name: Kitchen outlets
          - type: tile
            entity: sensor.energy_monitor_kitchen_lights_power
            name: Kitchen lights
          - type: tile
            entity: sensor.energy_monitor_laundry_outlets_power
            name: Laundry outlets
          - type: tile
            entity: sensor.energy_monitor_garage_power
            name: Garage
      - type: grid
        cards:
          - type: heading
            heading: Today
          # auto-entities (www/auto-entities.js, registered in
          # .storage/lovelace_resources): live-sorted highest→lowest by state.
          # Whole home is the sum, so it always sorts to the top.
          - type: custom:auto-entities
            card:
              type: entities
            sort:
              method: state
              numeric: true
              reverse: true
            filter:
              include:
                - entity_id: sensor.energy_monitor_total_daily_energy
                  options: { name: Whole home }
                - entity_id: sensor.energy_monitor_heat_pump_daily_energy
                  options: { name: Heat pump }
                - entity_id: sensor.energy_monitor_water_heater_daily_energy
                  options: { name: Water heater }
                - entity_id: sensor.energy_monitor_dryer_daily_energy
                  options: { name: Dryer }
                - entity_id: sensor.energy_monitor_hvac_indoor_units_daily_energy
                  options: { name: HVAC indoor }
                - entity_id: sensor.energy_monitor_living_room_daily_energy
                  options: { name: Living room }
                - entity_id: sensor.energy_monitor_family_room_daily_energy
                  options: { name: Family room }
                - entity_id: sensor.energy_monitor_refrigerator_daily_energy
                  options: { name: Refrigerator }
                - entity_id: sensor.energy_monitor_master_daily_energy
                  options: { name: Master }
                - entity_id: sensor.energy_monitor_bedroom_1_daily_energy
                  options: { name: Bedroom 1 }
                - entity_id: sensor.energy_monitor_nursery_daily_energy
                  options: { name: Nursery }
                - entity_id: sensor.energy_monitor_kitchen_outlets_daily_energy
                  options: { name: Kitchen outlets }
                - entity_id: sensor.energy_monitor_kitchen_lights_daily_energy
                  options: { name: Kitchen lights }
                - entity_id: sensor.energy_monitor_laundry_outlets_daily_energy
                  options: { name: Laundry outlets }
                - entity_id: sensor.energy_monitor_dishwasher_daily_energy
                  options: { name: Dishwasher }
                - entity_id: sensor.energy_monitor_garage_daily_energy
                  options: { name: Garage }

      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: History
          - type: custom:apexcharts-card
            grid_options:
              columns: full
            graph_span: 24h
            header:
              show: true
              title: Whole home — last 24h
              show_states: true
              colorize_states: true
            yaxis:
              - decimals: 0
                min: 0
                apex_config:
                  tickAmount: 4
            apex_config:
              chart:
                height: 260
              grid:
                borderColor: "rgba(255, 255, 255, 0.08)"
            all_series_config:
              stroke_width: 2
              group_by:
                func: avg
                duration: 10min
              show:
                extremas: false
                legend_value: false
            series:
              - entity: sensor.energy_monitor_total_power
                name: Total
                color: "#3987e5"
                type: area
                opacity: 0.15
          - type: custom:apexcharts-card
            grid_options:
              columns: full
            graph_span: 24h
            header:
              show: true
              title: Big loads — last 24h
              show_states: true
              colorize_states: true
            yaxis:
              - decimals: 0
                min: 0
                apex_config:
                  tickAmount: 4
            apex_config:
              chart:
                height: 300
              grid:
                borderColor: "rgba(255, 255, 255, 0.08)"
              legend:
                show: true
            all_series_config:
              stroke_width: 2
              group_by:
                func: avg
                duration: 10min
              show:
                extremas: false
                legend_value: false
            series:
              - entity: sensor.energy_monitor_heat_pump_power
                name: Heat pump
                color: "#3987e5"
              - entity: sensor.energy_monitor_water_heater_power
                name: Water heater
                color: "#d95926"
              - entity: sensor.energy_monitor_dryer_power
                name: Dryer
                color: "#199e70"
              - entity: sensor.energy_monitor_hvac_indoor_units_power
                name: HVAC indoor units
                color: "#c98500"
          - type: custom:apexcharts-card
            grid_options:
              columns: full
            graph_span: 24h
            header:
              show: true
              title: Rooms & plugs — last 24h
              show_states: true
              colorize_states: true
            yaxis:
              - decimals: 0
                min: 0
                apex_config:
                  tickAmount: 4
            apex_config:
              chart:
                height: 300
              grid:
                borderColor: "rgba(255, 255, 255, 0.08)"
              legend:
                show: true
            all_series_config:
              stroke_width: 2
              group_by:
                func: avg
                duration: 10min
              show:
                extremas: false
                legend_value: false
            series:
              - entity: sensor.energy_monitor_living_room_power
                name: Living room
                color: "#3987e5"
              - entity: sensor.energy_monitor_family_room_power
                name: Family room
                color: "#d95926"
              - entity: sensor.energy_monitor_master_power
                name: Master
                color: "#199e70"
              - entity: sensor.energy_monitor_bedroom_1_power
                name: Bedroom 1
                color: "#c98500"
              - entity: sensor.energy_monitor_nursery_power
                name: Nursery
                color: "#d55181"
              - entity: sensor.energy_monitor_refrigerator_power
                name: Refrigerator
                color: "#9b7ce6"
